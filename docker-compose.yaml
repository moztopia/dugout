name: dugout

services:
  portainer:
    image: portainer/portainer-ce:2.39.2
    container_name: do_portainer
    restart: unless-stopped
    deploy:
      replicas: ${DUGOUT_PORTAINER_ENABLED:-1}
    ports:
      - "127.0.0.1:${DUGOUT_PORTAINER_PORT:-9000}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./services/portainer/config:/config
      - ./services/portainer/logs:/logs
      - do_portainer_data:/data
    networks:
      - moznet

  adminer:
    image: adminer:5.4.2
    container_name: do_adminer
    restart: unless-stopped
    deploy:
      replicas: ${DUGOUT_ADMINER_ENABLED:-1}
    ports:
      - "127.0.0.1:${DUGOUT_ADMINER_PORT:-8080}:8080"
    volumes:
      - ./services/adminer/config:/config
      - ./services/adminer/logs:/logs
      - do_adminer_data:/var/www/html
    networks:
      - moznet

  mailpit:
    image: axllent/mailpit:v1.30.6
    container_name: do_mailpit
    restart: unless-stopped
    deploy:
      replicas: ${DUGOUT_MAILPIT_ENABLED:-1}
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    ports:
      - "127.0.0.1:${DUGOUT_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${DUGOUT_MAILPIT_HTTP_PORT:-8025}:8025"
    volumes:
      - do_mailpit_data:/data
    networks:
      - moznet

  dozzle:
    image: amir20/dozzle:v10.6.13
    container_name: do_dozzle
    restart: unless-stopped
    deploy:
      replicas: ${DUGOUT_DOZZLE_ENABLED:-1}
    ports:
      - "127.0.0.1:${DUGOUT_DOZZLE_PORT:-9999}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - moznet

  # pihole:
  #   image: pihole/pihole:latest
  #   container_name: do_pihole
  #   restart: unless-stopped
  #   ports:
  #     - "5353:53/tcp"
  #     - "5353:53/udp"
  #   environment:
  #     TZ: Asia/Bangkok
  #     WEBPASSWORD: "changeme" # set your admin password
  #   volumes:
  #     - ./services/pihole/etc-pihole:/etc/pihole
  #     - ./services/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
  #   networks:
  #     - moznet

volumes:
  do_portainer_data:
  do_adminer_data:
  do_mailpit_data:
  # do_pihole_data:

networks:
  moznet:
    name: moznet
    driver: bridge
