name: dugout

services:
  portainer:
    image: portainer/portainer-ce:2.39.2
    container_name: do_portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./services/portainer/config:/config
      - ./services/portainer/logs:/logs
      - do_portainer_data:/data
    networks:
      - moznet
      - web-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK_NAME:-web-proxy}
      - traefik.http.routers.portainer.rule=Host(`portainer.localhost.moztopia.com`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls=true
      - traefik.http.services.portainer.loadbalancer.server.port=9000

  adminer:
    image: adminer:5.4.2
    container_name: do_adminer
    restart: unless-stopped
    volumes:
      - ./services/adminer/config:/config
      - ./services/adminer/logs:/logs
      - do_adminer_data:/var/www/html
    networks:
      - moznet
      - web-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK_NAME:-web-proxy}
      - traefik.http.routers.adminer.rule=Host(`adminer.localhost.moztopia.com`)
      - traefik.http.routers.adminer.entrypoints=websecure
      - traefik.http.routers.adminer.tls=true
      - traefik.http.services.adminer.loadbalancer.server.port=8080

  mailpit:
    image: axllent/mailpit:v1.30.6
    container_name: do_mailpit
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    expose:
      - "1025"
      - "8025"
    volumes:
      - do_mailpit_data:/data
    networks:
      - moznet
      - web-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK_NAME:-web-proxy}
      - traefik.http.routers.mailpit.rule=Host(`mailpit.localhost.moztopia.com`)
      - traefik.http.routers.mailpit.entrypoints=websecure
      - traefik.http.routers.mailpit.tls=true
      - traefik.http.services.mailpit.loadbalancer.server.port=8025

  dozzle:
    image: amir20/dozzle:v10.6.13
    container_name: do_dozzle
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - moznet
      - web-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK_NAME:-web-proxy}
      - traefik.http.routers.dozzle.rule=Host(`dozzle.localhost.moztopia.com`)
      - traefik.http.routers.dozzle.entrypoints=websecure
      - traefik.http.routers.dozzle.tls=true
      - traefik.http.services.dozzle.loadbalancer.server.port=8080

  # pihole:
  #   image: pihole/pihole:latest
  #   container_name: do_pihole
  #   restart: unless-stopped
  #   ports:
  #     - "5353:53/tcp"
  #     - "5353:53/udp"
  #   environment:
  #     TZ: Asia/Bangkok
  #     WEBPASSWORD: "changeme" # set your admin password
  #   volumes:
  #     - ./services/pihole/etc-pihole:/etc/pihole
  #     - ./services/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
  #   networks:
  #     - moznet

volumes:
  do_portainer_data:
  do_adminer_data:
  do_mailpit_data:
  # do_pihole_data:

networks:
  moznet:
    name: moznet
    driver: bridge
  web-proxy:
    external: true
    name: ${TRAEFIK_NETWORK_NAME:-web-proxy}
