  #     TZ: Asia/Bangkok
  #     WEBPASSWORD: "changeme" # set your admin password
  #   volumes:
  #     - ./services/pihole/etc-pihole:/etc/pihole
  #     - ./services/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
  #   networks:
  #     - moznet

volumes:
  do_proxy_data:
  do_proxy_letsencrypt:
  do_portainer_data:
  do_adminer_data:
  do_mailpit_data:
  do_minio_data:
  # do_pihole_data:

networks:
  moznet:
    name: moznet
    driver: bridge
