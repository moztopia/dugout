services:
  proxy:
    image: jc21/nginx-proxy-manager:2.15.1
    container_name: do_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
    volumes:
      - ./services/nginx-proxy-manager/config:/config
      - ./services/nginx-proxy-manager/logs:/var/log/nginx
      - do_proxy_data:/data
      - do_proxy_letsencrypt:/etc/letsencrypt
    depends_on:
      - portainer
      - adminer
    networks:
      - moznet

  portainer:
    image: portainer/portainer-ce:2.39.2
    container_name: do_portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./services/portainer/config:/config
      - ./services/portainer/logs:/logs
      - do_portainer_data:/data
    networks:
      - moznet

  adminer:
    image: adminer:5.4.2
    container_name: do_adminer
    restart: unless-stopped
    volumes:
      - ./services/adminer/config:/config
      - ./services/adminer/logs:/logs
      - do_adminer_data:/var/www/html
    networks:
      - moznet

  mailpit:
    image: axllent/mailpit:v1.30.6
    container_name: do_mailpit
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    expose:
      - "1025"
      - "8025"
    volumes:
      - do_mailpit_data:/data
    networks:
      - moznet

  dozzle:
    image: amir20/dozzle:v10.6.13
    container_name: do_dozzle
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - moznet

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: do_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DUGOUT_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${DUGOUT_MINIO_ROOT_PASSWORD:-minioadmin}
    expose:
      - "9000"
      - "9001"
    volumes:
      - do_minio_data:/data
    networks:
      - moznet

  # pihole:
  #   image: pihole/pihole:latest
  #   container_name: do_pihole
  #   restart: unless-stopped
  #   ports:
  #     - "5353:53/tcp"
  #     - "5353:53/udp"
