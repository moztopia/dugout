# dump_files.yaml

defaults:
  limit: 0
  no_recurse: false

projects:
  docs:
    files_to_find:
      - "*.md"
    exclude:
      - "*/_build/*"
      - "*/.venv/*"
    # root defaults to ./docs
    # output defaults to dump_files.docs.txt
  api:
    files_to_find:
      - "*.php"
      - "*.blade.php"
      - "*.env"
    exclude:
      - "*/vendor/*"
      - "*/storage/*"
      - "*/bootstrap/cache/*"
    # root defaults to ./api
    # output defaults to dump_files.api.txt

  app:
    files_to_find:
      - "*.yaml"
    exclude:
      - "*/build/*"
    # root defaults to ./app
    # output defaults to dump_files.app.txt

  packages:
    files_to_find:
      - "*.yaml"
      - "*.json"
    exclude:
      - "*/node_modules/*"
      - "*/dist/*"
    # root defaults to ./packages
    # output defaults to dump_files.packages.txt

  scripts:
    files_to_find:
      - "*.py"
      - "*.sh"
    exclude:
      - "*/__pycache__/*"
      - "*.log"
    # root defaults to ./scripts
    # output defaults to dump_files.scripts.txt

  website:
    files_to_find:
      - "*.js"
      - "*.jsx"
      - "*.ts"
      - "*.tsx"
    exclude:
      - "*/node_modules/*"
      - "*/.next/*"
      - "*/build/*"
    # root defaults to ./website
    # output defaults to dump_files.website.txt
